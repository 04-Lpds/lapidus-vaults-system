[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapidus-vault-systems"
version = "0.2.0"
description = "Read-only Morpho Vault V2 screening and capital-planning MVP preview"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lapidus-vaults = "lapidus_vaults.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
