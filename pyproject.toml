[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapidus-vault-systems"
version = "0.6.0a1"
description = "Supervised Morpho Vault V2 portfolio monitoring, allocation and receipt-reconciled execution"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lapidus-vaults = "lapidus_vaults.cli:main"
lvs = "lapidus_vaults.operator:main"

[tool.setuptools.packages.find]
where = ["src"]
